name: dimp

networks:
  dimp:
  vfps:

services:
  fhir-pseudonymizer:
    image: ghcr.io/miracum/fhir-pseudonymizer:v2.30.0@sha256:fd79c1108ca3366b57f4190eef9a4e49652fafae4bee403c7c6edd26d8a57808
    ports: [ ":8080" ]
    networks: [ "aether", "dimp" ]
    volumes:
      - "./anonymization.yaml:/opt/fhir-pseudonymizer/anonymization.yaml:ro"
    environment:
      DOTNET_EnableDiagnostics: 0
      PseudonymizationService: Vfps
      Vfps__Address: dns:///vfps:8081
      AnonymizationEngineConfigPath: /opt/fhir-pseudonymizer/anonymization.yaml
      UseSystemTextJsonFhirSerializer: true
    depends_on:
      - vfps
    cap_drop:
      - ALL
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    privileged: false

  vfps_db:
    image: docker.io/library/postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    networks: [ "vfps" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfps
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      timeout: 1s
      interval: 5s
      retries: 10

  vfps:
    image: ghcr.io/miracum/vfps:v1.9.1@sha256:6c8645d9d8a26c9f222b0187b2d9cc967bd79c532cf70f7702bb847d12918689 # x-release-please-version
    networks: [ "dimp", "vfps" ]
    ports: [ ":8080", ":8081" ]
    environment:
      COMPlus_EnableDiagnostics: 0
      ForceRunDatabaseMigrations: true
      ConnectionStrings__PostgreSQL: "Host=vfps_db;Port=5432;Database=vfps;Username=postgres;Password=postgres;Timeout=60;Max Auto Prepare=5;Application Name=vfps;Maximum Pool Size=50;"
      PGUSER: postgres
      PGPASSWORD: postgres
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      vfps_db:
        condition:
          service_healthy
