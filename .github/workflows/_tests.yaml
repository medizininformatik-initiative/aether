name: Tests

on:
  workflow_call:
    inputs:
      check_changes:
        description: 'Whether to check for code changes before running tests'
        type: boolean
        default: true

permissions: {}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ inputs.check_changes && steps.filter.outputs.code || 'true' }}
    steps:
      - name: Checkout code
        if: ${{ inputs.check_changes }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Check for code changes
        if: ${{ inputs.check_changes }}
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version: '1.25.5'
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./internal/... -coverprofile=coverage.txt ./tests/...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: medizininformatik-initiative/aether

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install Blazectl
        env:
          # renovate: datasource=github-release-attachments depName=samply/blazectl
          BLAZECTL_VERSION: v1.3.0
          BLAZECTL_CHECKSUM: 2e75ddfb9b35d0e78b5dda4d7ae4d08c45037729f5a45affd59ddb7252b75aba
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/install-blazectl.sh

      - name: Download test data
        working-directory: .github/test
        run: ../scripts/download-testdata.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull Docker images with retries
        working-directory: .github/test
        run: |
          echo "Extracting image list from docker compose configuration..."
          docker compose config --images | while read -r image; do
            echo "Pulling $image..."
            retry_count=0
            max_retries=3
            until docker pull "$image"; do
              retry_count=$((retry_count + 1))
              if [ $retry_count -ge $max_retries ]; then
                echo "Failed to pull $image after $max_retries attempts"
                exit 1
              fi
              echo "Retry $retry_count/$max_retries failed, waiting 10 seconds..."
              sleep 10
            done
            echo "Successfully pulled $image"
          done

      - name: Start Docker services
        working-directory: .github/test
        run: docker compose up --wait --timeout 300

      - name: Fix torch output directory permissions
        run: |
          docker compose -f .github/test/compose.yaml exec -T --user=root torch chown -R 1001:1001 /app/output

      - name: Upload test data to torch-hds
        working-directory: .github/test
        run: ../scripts/upload-testdata.sh

      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq ripgrep

      - name: Build aether
        run: make build

      - name: Run E2E tests with dynamic ports
        working-directory: .github/test
        run: ../scripts/run-e2e-test.sh

      - name: Verify E2E test output
        working-directory: .github/test
        run: |
          JOBS_DIR=./jobs ../scripts/verify-e2e-output.sh

      - name: Upload E2E job outputs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: e2e-job-outputs-${{ github.run_id }}
          path: .github/test/jobs/
          retention-days: 7
          if-no-files-found: warn

      - name: Capture service logs on failure
        if: failure()
        run: |
          docker compose -f .github/test/compose.yaml logs > docker-logs-e2e.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: docker-logs-e2e-${{ github.run_id }}
          path: docker-logs-e2e.txt
          retention-days: 7

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f .github/test/compose.yaml down -v

  test-status:
    name: Test Status
    runs-on: ubuntu-24.04
    needs: [detect-changes, e2e-test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check test results
        run: |
          echo "E2E Tests Result: ${{ needs.e2e-test.result }}"
          echo "Code Changed: ${{ needs.detect-changes.outputs.code }}"

          # Pass if e2e-test succeeded or was skipped (docs-only changes)
          if [[ "${{ needs.e2e-test.result }}" == "success" ]] || [[ "${{ needs.e2e-test.result }}" == "skipped" ]]; then
            echo "✅ Tests passed or were not required"
            exit 0
          else
            echo "❌ Tests failed"
            exit 1
          fi
