name: blaze

services:
  # Blaze FHIR server used as DSF transfer target for the send step
  blaze-fhir:
    image: samply/blaze:1.10.1@sha256:dcc951be40714a4eee5f78db08b90a5a9ea9d4a172f716bdb419f5c1a2feebc6
    ports: [ ":8080" ]
    networks: [ "aether" ]
    environment:
      BASE_URL: http://blaze-fhir:8080
      LOG_LEVEL: debug
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
