StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = aether

# Pinned by URL. A bare `Google` resolves to whatever the latest package release
# is, which would let a new upstream rule turn CI red on an unrelated PR.
Packages = https://github.com/vale-cli/packages/releases/download/v0.2.0/Google.zip

[*.md]
BasedOnStyles = Vale, Google, aether

# Title Case headings are the house style.
Google.Headings = NO

# Domain acronyms (FHIR, CRTDL, TORCH, DIMP, NDJSON) are defined on first use.
Google.Acronyms = NO
# The house style uses spaced em dashes.
Google.EmDash = NO
# Parenthetical asides and semicolons are normal in reference docs.
Google.Parens = NO
Google.Semicolons = NO
# Passive voice is often the correct subject choice when describing data flow.
Google.Passive = NO
Google.Contractions = NO
Google.We = NO
Google.FirstPerson = NO
Google.Will = NO
# Fires on "modes: CRTDL-based" and "**Note**: File ..." — false positives here.
Google.Colons = NO
# Logical quoting is intentional for technical strings.
Google.Quotes = NO

# Derives casing rules from the vocabulary, which false-positives on
# sentence-initial words. aether.Terms enforces terminology instead.
Vale.Terms = NO
