name: Release

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26.1'
          cache: true

      - name: Build release binaries
        run: make release

      - name: Upload build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: release-artifacts
          path: bin/release/
          retention-days: 1

  sign:
    name: Sign Release Artifacts
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: release/

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign release artifacts
        run: |
          for file in release/*; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              cosign sign-blob --yes "$file" --bundle "${file}.bundle"
            fi
          done

      - name: Generate SHA256 checksums
        run: |
          cd release
          for file in *; do
            if [ -f "$file" ] && [ "${file##*.}" != "bundle" ]; then
              sha256sum "$file" > "${file}.sha256"
            fi
          done

      - name: Generate in-toto attestations
        run: |
          for file in release/*; do
            if [ -f "$file" ] && [ "${file##*.}" != "bundle" ] && [ "${file##*.}" != "sha256" ]; then
              filename=$(basename "$file")
              echo "Creating attestation for $filename..."
              cosign attest-blob --yes \
                --predicate <(echo "{\"name\": \"$filename\"}") \
                --type intoto \
                "$file" --bundle "${file}.att.bundle"
            fi
          done

      - name: Upload signatures and checksums
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: signatures-checksums
          path: |
            release/*.bundle
            release/*.att.bundle
            release/*.sha256
          retention-days: 1

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0
        with:
          path: .
          format: spdx-json
          output-file: aether-sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: sbom
          path: aether-sbom.spdx.json
          retention-days: 90

  publish:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [build, attestation, sbom, sign]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: release/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: release/

      - name: Download signatures, checksums, and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signatures-checksums
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attestation:
    name: Generate Attestations
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - arch: linux-amd64
            path: bin/release/aether-*-linux-amd64.tar.gz
          - arch: darwin-amd64
            path: bin/release/aether-*-darwin-amd64.tar.gz
          - arch: darwin-arm64
            path: bin/release/aether-*-darwin-arm64.tar.gz
          - arch: windows-amd64
            path: bin/release/aether-*-windows-amd64.zip
          - arch: windows-arm64
            path: bin/release/aether-*-windows-arm64.zip
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a90bcbc6539c36a85cdfeb73f7e2f433735f215b # v2.15.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: bin/release/

      - name: Generate provenance attestation for ${{ matrix.arch }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: ${{ matrix.path }}
