name: dimp

networks:
  dimp:
  vfps:

services:
  fhir-pseudonymizer:
    image: ghcr.io/miracum/fhir-pseudonymizer:v3.1.2@sha256:27ca97c99ceb89ff69dda9dfdb72c74598d8a124e6b9748af04bad098006eaa3
    ports: [ ":8080" ]
    networks: [ "aether", "dimp" ]
    volumes:
      - "./anonymization.yaml:/opt/fhir-pseudonymizer/anonymization.yaml:ro"
    environment:
      DOTNET_EnableDiagnostics: 0
      PseudonymizationService: Vfps
      Vfps__Address: dns:///vfps:8081
      AnonymizationEngineConfigPath: /opt/fhir-pseudonymizer/anonymization.yaml
      UseSystemTextJsonFhirSerializer: true
    depends_on:
      - vfps
    cap_drop:
      - ALL
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    privileged: false

  vfps_db:
    image: docker.io/library/postgres:18.7@sha256:9f4fd4aa918f52ae3d6f3b687f1de90d8f867cd4d520021545a9a50c120eae3b
    networks: [ "vfps" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfps
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      timeout: 1s
      interval: 5s
      retries: 10

  vfps:
    image: ghcr.io/miracum/vfps:v1.28.0@sha256:bea463643cff9b9640a3e87363adec322eec3cf803eabf616f56a5628f041a0e # x-release-please-version
    networks: [ "dimp", "vfps" ]
    ports: [ ":8080", ":8081" ]
    environment:
      COMPlus_EnableDiagnostics: 0
      ForceRunDatabaseMigrations: true
      ConnectionStrings__PostgreSQL: "Host=vfps_db;Port=5432;Database=vfps;Username=postgres;Password=postgres;Timeout=60;Max Auto Prepare=5;Application Name=vfps;Maximum Pool Size=50;"
      PGUSER: postgres
      PGPASSWORD: postgres
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      vfps_db:
        condition:
          service_healthy
