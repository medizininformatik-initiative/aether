# Aether E2E Test Configuration
# Uses internal Docker hostnames since aether runs inside the Docker network

services:
  torch:
    # TORCH server base URL (points to reverse proxy inside Docker network)
    base_url: "http://torch-proxy:80"

    # TORCH authentication credentials
    username: ""
    password: ""

    # Maximum time to wait for extraction completion (in minutes)
    extraction_timeout_minutes: 30

    # Initial polling interval when checking extraction status (in seconds)
    polling_interval_seconds: 5

    # Maximum polling interval (exponential backoff cap, in seconds)
    max_polling_interval_seconds: 30

  # DIMP Pseudonymization Service
  dimp:
    url: "http://fhir-pseudonymizer:8080/fhir"
    bundle_split_threshold_mb: 10

  # CSV Conversion Service (not running in test environment)
  csv_conversion:
    url: ""

  # Parquet Conversion Service (not running in test environment)
  parquet_conversion:
    url: ""

  # Flattening Service (FHIR to CSV transformation)
  flattening:
    service_url: "http://fhir-flattener:8000"
    lookup_path: "/app/torch/queries/flatten-lookup.json"
    formats:
      - csv
    timeout: 30m

pipeline:
  # List of steps to execute in order
  # Options: import, dimp, validation, csv_conversion, parquet_conversion
  # NOTE: 'import' must always be the first step
  enabled_steps:
    - torch
    - wait
    - dimp
    - flattening
    # - csv_conversion  # Commented out - service not running
    # - parquet_conversion  # Commented out - service not running

retry:
  # Maximum number of retry attempts for transient errors (network, 5xx)
  # Range: 1-10
  max_attempts: 5

  # Initial backoff delay in milliseconds
  initial_backoff_ms: 1000

  # Maximum backoff delay in milliseconds (exponential backoff cap)
  max_backoff_ms: 30000

# Compression settings for pipeline output files
compression:
  # Enable zstd compression (default: true)
  enabled: true

  # Compression level: fastest, default, better, best
  level: "default"

# Directory to store job state and data
# Can be absolute or relative path
jobs_dir: "./jobs"
