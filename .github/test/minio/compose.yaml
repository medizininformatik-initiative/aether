name: minio

services:
  # MinIO S3-compatible object store for S3 upload E2E testing.
  # Starts the server, creates the test bucket, then stays running.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z@sha256:ed9be66eb5f2636c18289c34c3b725ddf57815f2777c77b5938543b78a44f144
    ports: [ ":9000", ":9001" ]
    networks: [ "aether" ]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint:
      - /bin/sh
      - -c
      - |
        minio server /data --console-address ":9001" &
        until mc ready local 2>/dev/null; do sleep 1; done
        mc alias set local http://localhost:9000 minioadmin minioadmin
        mc mb --ignore-existing local/aether-test
        echo "Bucket aether-test created"
        wait
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
