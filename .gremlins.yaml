# Settings for gremlins mutation testing. Run it with scripts/mutation.sh,
# or with "make mutation" and "make mutation-diff".
unleash:
  # The tests are in tests/, outside the package under test. Without integration
  # mode, every mutant gets the status NOT COVERED.
  integration: true
  coverpkg: ./internal/...
  # The default worker count and timeout give TIMED OUT results that change
  # between runs.
  workers: 2
  timeout-coefficient: 6
  # gremlins fails when the test efficacy is not above this value. On a pull
  # request with fewer than 21 tested mutants, one lived mutant fails the run.
  threshold:
    efficacy: 95
