name: License Check

on:
  workflow_call:

permissions: {}

jobs:
  go-licenses:
    name: go-licenses
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      # go-licenses shows warnings for assembly files it cannot inspect.
      # These warnings are safe to ignore. Only a bad license fails the step.
      - name: Run go-licenses
        run: go run github.com/google/go-licenses@v1.6.0 check --disallowed_types=forbidden,restricted ./...
