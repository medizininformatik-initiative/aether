name: Tests

on:
  workflow_call:
    inputs:
      check_changes:
        description: 'Whether to check for code changes before running tests'
        type: boolean
        default: true

permissions: {}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ inputs.check_changes && steps.filter.outputs.code || 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        if: ${{ inputs.check_changes }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for code changes
        if: ${{ inputs.check_changes }}
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            code:
              - '!docs/**'

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests with coverage
        run: go test -coverpkg=./internal/... -coverprofile=coverage.txt ./tests/...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: medizininformatik-initiative/aether

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Blazectl
        env:
          # renovate: datasource=github-release-attachments depName=samply/blazectl
          BLAZECTL_VERSION: v1.5.0
          BLAZECTL_CHECKSUM: bb2127c23d3a523e5fd02b3fa84decee27eb5ec32f8726ce1f3f29b49182ff5f
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/install-blazectl.sh

      - name: Download test data
        working-directory: .github/test
        run: ../scripts/download-testdata.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull Docker images with retries
        working-directory: .github/test
        run: |
          echo "Extracting image list from docker compose configuration..."
          docker compose config --images | while read -r image; do
            echo "Pulling $image..."
            retry_count=0
            max_retries=3
            until docker pull "$image"; do
              retry_count=$((retry_count + 1))
              if [ $retry_count -ge $max_retries ]; then
                echo "Failed to pull $image after $max_retries attempts"
                exit 1
              fi
              echo "Retry $retry_count/$max_retries failed, waiting 10 seconds..."
              sleep 10
            done
            echo "Successfully pulled $image"
          done

      - name: Start Docker services
        working-directory: .github/test
        run: docker compose up --wait --timeout 300

      - name: Fix torch output directory permissions
        run: |
          docker compose -f .github/test/compose.yaml exec -T --user=root torch chown -R 1001:1001 /app/output

      - name: Upload test data to torch-hds
        working-directory: .github/test
        run: ../scripts/upload-testdata.sh

      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq ripgrep

      - name: Build aether
        run: make build

      - name: Run E2E tests with dynamic ports
        working-directory: .github/test
        run: ../scripts/run-e2e-test.sh

      - name: Verify E2E test output
        working-directory: .github/test
        run: |
          JOBS_DIR=./jobs ../scripts/verify-e2e-output.sh

      - name: Upload E2E job outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-job-outputs-${{ github.run_id }}
          path: .github/test/jobs/
          retention-days: 7
          if-no-files-found: warn

      - name: Capture service logs on failure
        if: failure()
        run: |
          docker compose -f .github/test/compose.yaml logs > docker-logs-e2e.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-e2e-${{ github.run_id }}
          path: docker-logs-e2e.txt
          retention-days: 7

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f .github/test/compose.yaml down -v

  e2e-test-direct-load:
    name: E2E Direct Resource Load Tests
    runs-on: ubuntu-24.04
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Blazectl
        env:
          # renovate: datasource=github-release-attachments depName=samply/blazectl
          BLAZECTL_VERSION: v1.5.0
          BLAZECTL_CHECKSUM: bb2127c23d3a523e5fd02b3fa84decee27eb5ec32f8726ce1f3f29b49182ff5f
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/install-blazectl.sh

      - name: Download test data
        working-directory: .github/test
        run: ../scripts/download-testdata.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull Docker images with retries
        working-directory: .github/test
        run: |
          echo "Extracting image list from docker compose configuration..."
          docker compose config --images | while read -r image; do
            echo "Pulling $image..."
            retry_count=0
            max_retries=3
            until docker pull "$image"; do
              retry_count=$((retry_count + 1))
              if [ $retry_count -ge $max_retries ]; then
                echo "Failed to pull $image after $max_retries attempts"
                exit 1
              fi
              echo "Retry $retry_count/$max_retries failed, waiting 10 seconds..."
              sleep 10
            done
            echo "Successfully pulled $image"
          done

      - name: Start Docker services
        working-directory: .github/test
        run: docker compose up --wait --timeout 300

      - name: Fix torch output directory permissions
        run: |
          docker compose -f .github/test/compose.yaml exec -T --user=root torch chown -R 1001:1001 /app/output

      - name: Upload test data to torch-hds
        working-directory: .github/test
        run: ../scripts/upload-testdata.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build aether
        run: make build

      - name: Run direct resource load E2E test
        working-directory: .github/test
        run: ../scripts/run-direct-load-e2e-test.sh

      - name: Upload E2E job outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-direct-load-outputs-${{ github.run_id }}
          path: .github/test/jobs/
          retention-days: 7
          if-no-files-found: warn

      - name: Capture service logs on failure
        if: failure()
        run: |
          docker compose -f .github/test/compose.yaml logs > docker-logs-direct-load.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-direct-load-${{ github.run_id }}
          path: docker-logs-direct-load.txt
          retention-days: 7

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f .github/test/compose.yaml down -v

  e2e-test-flattening:
    name: E2E Flattening Tests
    runs-on: ubuntu-24.04
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull Docker images
        working-directory: .github/test/flattener
        run: |
          echo "Pulling fhir-flattener image..."
          docker compose config --images | while read -r image; do
            docker pull "$image" || exit 1
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build aether
        run: make build

      - name: Start flattener and runner services
        working-directory: .github/test
        run: docker compose up -d --wait aether-runner fhir-flattener

      - name: Run flattening E2E test
        working-directory: .github/test
        run: ../scripts/run-flattening-e2e-test.sh

      - name: Upload flattening job outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-flattening-outputs-${{ github.run_id }}
          path: .github/test/jobs/
          retention-days: 7
          if-no-files-found: warn

      - name: Capture service logs on failure
        if: failure()
        run: |
          docker compose -f .github/test/flattener/compose.yaml logs > docker-logs-flattening.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-flattening-${{ github.run_id }}
          path: docker-logs-flattening.txt
          retention-days: 7

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f .github/test/compose.yaml down -v

  e2e-test-validation:
    name: E2E Validation Tests
    runs-on: ubuntu-24.04
    needs: [detect-changes, test]
    if: needs.detect-changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull Docker images
        working-directory: .github/test/validator
        run: |
          echo "Pulling fhir-validator image..."
          docker compose config --images | while read -r image; do
            docker pull "$image" || exit 1
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build aether
        run: make build

      - name: Start validator and runner services
        working-directory: .github/test
        run: docker compose up -d --wait aether-runner fhir-validator

      - name: Run validation E2E test
        working-directory: .github/test
        run: ../scripts/run-validation-e2e-test.sh

      - name: Upload validation job outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-validation-outputs-${{ github.run_id }}
          path: .github/test/jobs/
          retention-days: 7
          if-no-files-found: warn

      - name: Capture service logs on failure
        if: failure()
        run: |
          docker compose -f .github/test/compose.yaml logs fhir-validator > docker-logs-validation.txt

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-logs-validation-${{ github.run_id }}
          path: docker-logs-validation.txt
          retention-days: 7

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f .github/test/compose.yaml down -v

  test-status:
    name: Test Status
    runs-on: ubuntu-24.04
    needs: [detect-changes, e2e-test, e2e-test-direct-load, e2e-test-flattening, e2e-test-validation]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check test results
        run: |
          echo "E2E Tests Result: ${{ needs.e2e-test.result }}"
          echo "E2E Direct Load Tests Result: ${{ needs.e2e-test-direct-load.result }}"
          echo "E2E Flattening Tests Result: ${{ needs.e2e-test-flattening.result }}"
          echo "E2E Validation Tests Result: ${{ needs.e2e-test-validation.result }}"
          echo "Code Changed: ${{ needs.detect-changes.outputs.code }}"

          # Pass if all e2e tests succeeded or were skipped (docs-only changes)
          E2E_OK=false
          DIRECT_OK=false
          FLAT_OK=false
          VAL_OK=false

          if [[ "${{ needs.e2e-test.result }}" == "success" ]] || [[ "${{ needs.e2e-test.result }}" == "skipped" ]]; then
            E2E_OK=true
          fi

          if [[ "${{ needs.e2e-test-direct-load.result }}" == "success" ]] || [[ "${{ needs.e2e-test-direct-load.result }}" == "skipped" ]]; then
            DIRECT_OK=true
          fi

          if [[ "${{ needs.e2e-test-flattening.result }}" == "success" ]] || [[ "${{ needs.e2e-test-flattening.result }}" == "skipped" ]]; then
            FLAT_OK=true
          fi

          if [[ "${{ needs.e2e-test-validation.result }}" == "success" ]] || [[ "${{ needs.e2e-test-validation.result }}" == "skipped" ]]; then
            VAL_OK=true
          fi

          if [[ "$E2E_OK" == "true" ]] && [[ "$DIRECT_OK" == "true" ]] && [[ "$FLAT_OK" == "true" ]] && [[ "$VAL_OK" == "true" ]]; then
            echo "Tests passed or were not required"
            exit 0
          else
            echo "Tests failed"
            exit 1
          fi
