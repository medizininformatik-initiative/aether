name: torch

networks:
  torch:

services:
  torch-proxy:
      networks: [ "aether", "torch" ]
      restart: unless-stopped
      image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:26b5d4920434bc4d8c17a68201488cf4b3d2391f0d25305cdfe66ccdc6d18aa4
      ports: [ ":80" ]
      volumes:
        - ./torch.nginx.conf:/etc/nginx/nginx.conf
        - ./output:/app/output
      depends_on:
        - torch
  torch:
    restart: unless-stopped
    image: ghcr.io/medizininformatik-initiative/torch:1.0.0-beta.4@sha256:1515460471dcdca32048b3008bb9f5bd847ce70e25a12c86f72af2d8b1babb57
    # image: torch:latest
    networks: [ "aether", "torch" ]
    ports:
      - ":8080"
    environment:
      TORCH_RESULTS_PERSISTENCE: PT12H30M5S
      TORCH_BUFFERSIZE: 100
      # Connection Config
      TORCH_BASE_URL: http://torch:8080
      TORCH_OUTPUT_FILE_SERVER_URL: http://torch-proxy:80
      # FHIR server connection
      TORCH_FLARE_URL: http://torch-flare:8080
      TORCH_FHIR_URL: http://torch-hds:8080/fhir
      # Execution variables
      JAVA_TOOL_OPTIONS: >-
        -Xmx8g
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9010
        -Dcom.sun.management.jmxremote.rmi.port=9010
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=localhost
      TORCH_USE_CQL: true
      TORCH_FHIR_DISABLE_ASYNC: true
      TORCH_BATCHSIZE: 500
      TORCH_FHIR_PAGE_COUNT: 500
      TORCH_FHIR_MAX_CONNECTIONS: 50
      TORCH_MAXCONCURRENCY: 4
      # Other
      LOG_LEVEL: trace
      
    volumes:
      - ./output:/app/output
    extra_hosts:
      - auth.localhost:host-gateway
    depends_on:
      - torch-hds
    
  torch-hds:
    image: samply/blaze:1.9.0@sha256:cba859fb460df3938792226f16ba9bde32bf8dd9edeeadffbd818bccdcce56dc
    ports: [ ":8080" ]
    networks: [ "torch" ]
    environment:
      BASE_URL: http://torch-hds:8080
      DB_RESOURCE_CACHE_SIZE: "100000"  # Cache up to 100K resources
      DB_MAX_SEARCH_RESULT_SIZE: "200000"  # Allow large search results
      LOG_LEVEL: debug
      JAVA_TOOL_OPTIONS: "-Xmx8g"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      
      
volumes:
  torch-data:

