name: blaze

services:
  # Blaze FHIR server used as DSF transfer target for the send step
  blaze-fhir:
    image: samply/blaze:1.8.0@sha256:1f0587553e14105d64e0877e5ae2d7450705293e50ab7b1567787ba2b2c9a891
    ports: [ ":8080" ]
    networks: [ "aether" ]
    environment:
      BASE_URL: http://blaze-fhir:8080
      LOG_LEVEL: debug
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
