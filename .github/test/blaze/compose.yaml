name: blaze

services:
  # Blaze FHIR server used as DSF transfer target for the send step
  blaze-fhir:
    image: samply/blaze:1.13.0@sha256:808d04a6224ca926ab2422d4235cd008399b5e4d4f5855d52fd2715de295f1c2
    ports: [ ":8080" ]
    networks: [ "aether" ]
    environment:
      BASE_URL: http://blaze-fhir:8080
      LOG_LEVEL: debug
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
