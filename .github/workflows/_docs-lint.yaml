name: Docs Lint

on:
  workflow_call:

permissions: {}

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Vale
        env:
          # renovate: datasource=github-release-attachments depName=errata-ai/vale
          VALE_VERSION: v3.20.0
          VALE_CHECKSUM: f59e7030c5d4ace6cf915497d0d076a1699d61e876142765963237e6867c9712
        run: .github/scripts/install-vale.sh

      # Downloads the Google style package declared in .vale.ini. The custom
      # aether style and vocabulary are committed, so only this is fetched.
      - name: Sync Vale styles
        run: vale sync

      # Gates on error-level rules only: terminology (aether.Terms) and Google's
      # mechanical checks. Warning-level rules stay visible in `make lint-docs`
      # without blocking a PR.
      - name: Run Vale
        run: vale --minAlertLevel=error --glob='!**/node_modules/**' docs
