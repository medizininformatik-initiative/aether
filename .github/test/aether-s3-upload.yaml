# Aether E2E Test Configuration for S3 Upload
# Uses a simple torch -> send pipeline to upload files to MinIO (S3-compatible)

services:
  torch:
    # TORCH server base URL (points to reverse proxy inside Docker network)
    base_url: "http://torch-proxy:80"

    # TORCH authentication credentials
    username: ""
    password: ""

    # Maximum time to wait for extraction completion (in minutes)
    extraction_timeout_minutes: 30

    # Initial polling interval when checking extraction status (in seconds)
    polling_interval_seconds: 5

    # Maximum polling interval (exponential backoff cap, in seconds)
    max_polling_interval_seconds: 30

  # Send step configuration - S3 upload to MinIO
  send:
    send_as: "s3_upload"
    s3:
      endpoint: "http://minio:9000"
      region: "us-east-1"
      bucket: "aether-test"
      access_key_id: "minioadmin"
      secret_access_key: "minioadmin"
      use_path_style: true
      timeout: 10m

pipeline:
  # Simple two-step pipeline: extract from TORCH, upload to S3
  enabled_steps:
    - torch
    - send

# Compression settings for pipeline output files
compression:
  enabled: true
  level: "default"

# Directory to store job state and data
jobs_dir: "./jobs"
