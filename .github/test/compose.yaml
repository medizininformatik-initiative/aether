name: aether-test

networks:
  aether:

include:
  - torch/compose.yaml
  - dimp/compose.yaml
  - flattener/compose.yaml
  - blaze/compose.yaml
  - validator/compose.yaml
  - seaweedfs/compose.yaml

services:
  # E2E test runner - runs aether inside the Docker network
  # This allows aether to resolve internal hostnames (torch, torch-proxy, etc.)
  aether-runner:
    image: debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
    networks: [ "aether", "dimp" ]
    working_dir: /app
    volumes:
      - ./aether.yaml:/app/aether.yaml:ro
      - ./aether-flattening.yaml:/app/aether-flattening.yaml:ro
      - ./aether-validation.yaml:/app/aether-validation.yaml:ro
      - ./aether-direct-load.yaml:/app/aether-direct-load.yaml:ro
      - ./aether-s3-upload.yaml:/app/aether-s3-upload.yaml:ro
      - ./aether-dimp-anonymization-config.yaml:/app/aether-dimp-anonymization-config.yaml:ro
      - ./torch/queries:/app/torch/queries:ro
      - ./example-flattening:/app/example-flattening:ro
      - ./example-validation:/app/example-validation:ro
      - ./example-dimp-anonymization-config:/app/example-dimp-anonymization-config:ro
      - ./jobs:/app/jobs
    # Keep container running so we can exec into it
    command: ["sleep", "infinity"]
    depends_on:
      - torch-proxy
      - fhir-pseudonymizer
      - fhir-flattener
      - fhir-validator
      - blaze-fhir
      - seaweedfs
