name: blaze

services:
  # Blaze FHIR server used as DSF transfer target for the send step
  blaze-fhir:
    image: samply/blaze:1.9.0@sha256:cba859fb460df3938792226f16ba9bde32bf8dd9edeeadffbd818bccdcce56dc
    ports: [ ":8080" ]
    networks: [ "aether" ]
    environment:
      BASE_URL: http://blaze-fhir:8080
      LOG_LEVEL: debug
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
