# Aether E2E Test Configuration for Direct Resource Load
# Uses a simple torch → send pipeline to upload FHIR resources directly to a FHIR server

services:
  torch:
    # TORCH server base URL (points to reverse proxy inside Docker network)
    base_url: "http://torch-proxy:80"

    # TORCH authentication credentials
    username: ""
    password: ""

    # Maximum time to wait for extraction completion (Go duration string, e.g. 30m)
    extraction_timeout: PT30M

    # Initial polling interval when checking extraction status (Go duration string, e.g. 5s)
    polling_interval: PT5S

    # Maximum polling interval (exponential backoff cap, in seconds)
    max_polling_interval: PT30S

  # Send step configuration - direct resource load to Blaze FHIR server
  send:
    url: "http://blaze-fhir:8080"
    send_as: "direct_resource_load"
    batch_size: 100

pipeline:
  # Simple two-step pipeline: extract from TORCH, upload directly to FHIR server
  enabled_steps:
    - torch
    - send

# Compression settings for pipeline output files
compression:
  enabled: true
  level: "default"

# Directory to store job state and data
jobs_dir: "./jobs"
