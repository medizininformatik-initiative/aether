name: dimp

networks:
  dimp:
  vfps:

services:
  fhir-pseudonymizer:
    image: ghcr.io/miracum/fhir-pseudonymizer:v3.2.0@sha256:da43bd52f43a89773511d79f1e52b5d1fc4c0f513ff97a3036fc85ea1e2e28fc
    ports: [ ":8080" ]
    networks: [ "aether", "dimp" ]
    volumes:
      - "./anonymization.yaml:/opt/fhir-pseudonymizer/anonymization.yaml:ro"
    environment:
      DOTNET_EnableDiagnostics: 0
      PseudonymizationService: Vfps
      Vfps__Address: dns:///vfps:8081
      AnonymizationEngineConfigPath: /opt/fhir-pseudonymizer/anonymization.yaml
      UseSystemTextJsonFhirSerializer: true
    depends_on:
      - vfps
    cap_drop:
      - ALL
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    privileged: false

  vfps_db:
    image: docker.io/library/postgres:18.7@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    networks: [ "vfps" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfps
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      timeout: 1s
      interval: 5s
      retries: 10

  vfps:
    image: ghcr.io/miracum/vfps:v1.29.0@sha256:eb6a85aadec823a0eee77ad27c095a150120fc89f28f3bf97abc0fa138ec6599 # x-release-please-version
    networks: [ "dimp", "vfps" ]
    ports: [ ":8080", ":8081" ]
    environment:
      COMPlus_EnableDiagnostics: 0
      ForceRunDatabaseMigrations: true
      ConnectionStrings__PostgreSQL: "Host=vfps_db;Port=5432;Database=vfps;Username=postgres;Password=postgres;Timeout=60;Max Auto Prepare=5;Application Name=vfps;Maximum Pool Size=50;"
      PGUSER: postgres
      PGPASSWORD: postgres
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      vfps_db:
        condition:
          service_healthy
