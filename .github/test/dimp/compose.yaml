name: dimp

networks:
  dimp:
  vfps:

services:
  fhir-pseudonymizer:
    image: ghcr.io/miracum/fhir-pseudonymizer:v2.37.3@sha256:a4e8ff154c8aabd9880aa8f81af81b41bf57a5186ba1bf402b5c3dd5dd9787dd
    ports: [ ":8080" ]
    networks: [ "aether", "dimp" ]
    volumes:
      - "./anonymization.yaml:/opt/fhir-pseudonymizer/anonymization.yaml:ro"
    environment:
      DOTNET_EnableDiagnostics: 0
      PseudonymizationService: Vfps
      Vfps__Address: dns:///vfps:8081
      AnonymizationEngineConfigPath: /opt/fhir-pseudonymizer/anonymization.yaml
      UseSystemTextJsonFhirSerializer: true
    depends_on:
      - vfps
    cap_drop:
      - ALL
    ipc: none
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    privileged: false

  vfps_db:
    image: docker.io/library/postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    networks: [ "vfps" ]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vfps
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 1g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      timeout: 1s
      interval: 5s
      retries: 10

  vfps:
    image: ghcr.io/miracum/vfps:v1.20.1@sha256:da529ce65004623664b332ef1d2b06b2c3cd4d535c539412f735169613875ac1 # x-release-please-version
    networks: [ "dimp", "vfps" ]
    ports: [ ":8080", ":8081" ]
    environment:
      COMPlus_EnableDiagnostics: 0
      ForceRunDatabaseMigrations: true
      ConnectionStrings__PostgreSQL: "Host=vfps_db;Port=5432;Database=vfps;Username=postgres;Password=postgres;Timeout=60;Max Auto Prepare=5;Application Name=vfps;Maximum Pool Size=50;"
      PGUSER: postgres
      PGPASSWORD: postgres
    ipc: none
    cap_drop:
      - ALL
    read_only: true
    privileged: false
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      vfps_db:
        condition:
          service_healthy
