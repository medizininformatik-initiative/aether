# Aether E2E Test Configuration for S3 Upload
# Uses a simple torch -> send pipeline to upload files to SeaweedFS (S3-compatible)

services:
  torch:
    # TORCH server base URL (points to reverse proxy inside Docker network)
    base_url: "http://torch-proxy:80"

    # TORCH authentication credentials
    username: ""
    password: ""

    # Maximum time to wait for extraction completion (Go duration string, e.g. 30m)
    extraction_timeout: PT30M

    # Initial polling interval when checking extraction status (Go duration string, e.g. 5s)
    polling_interval: PT5S

    # Maximum polling interval (exponential backoff cap, in seconds)
    max_polling_interval: PT30S

  # Send step configuration - S3 upload to SeaweedFS
  send:
    send_as: "s3_upload"
    s3:
      endpoint: "http://seaweedfs:8333"
      region: "us-east-1"
      bucket: "aether-test"
      access_key_id: "aetheradmin"
      secret_access_key: "aetheradmin"
      use_path_style: true
      timeout: 10m

pipeline:
  # Simple two-step pipeline: extract from TORCH, upload to S3
  enabled_steps:
    - torch
    - send

# Compression settings for pipeline output files
compression:
  enabled: true
  level: "default"

# Directory to store job state and data
jobs_dir: "./jobs"
