name: CI

on:
  push:
    tags: [ "v*.*.*" ]
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:
  branch_protection_rule:
  schedule:
    - cron: '15 7 * * 2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/_lint.yaml
    secrets: inherit

  # Pull requests only: base.sha exists on no other event, and direct pushes to
  # main are blocked by the ruleset instead.
  dco:
    name: DCO
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/_dco.yaml
    with:
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}

  docs-lint:
    name: Docs Lint
    uses: ./.github/workflows/_docs-lint.yaml

  codeql:
    name: CodeQL
    uses: ./.github/workflows/_codeql.yaml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write

  vuln:
    name: Vulnerability Check
    uses: ./.github/workflows/_vuln.yaml
    secrets: inherit

  build:
    name: Build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/_build.yaml

  tests:
    name: Tests
    needs: [lint]
    if: ${{ always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    uses: ./.github/workflows/_tests.yaml
    with:
      check_changes: ${{ !startsWith(github.ref, 'refs/tags/') }}
    secrets: inherit

  release:
    name: Release
    needs: [tests]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/_release.yaml
    secrets: inherit
    permissions:
      contents: write
      attestations: write
      id-token: write
