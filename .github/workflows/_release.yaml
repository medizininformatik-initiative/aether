name: Release

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build release binaries
        run: make release

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: bin/release/
          retention-days: 1

  sign:
    name: Sign Release Artifacts
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: release/

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts
        run: |
          for file in release/*; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              cosign sign-blob --yes "$file" --bundle "${file}.sigstore"
            fi
          done

      - name: Generate SHA256 checksums
        run: |
          cd release
          for file in *; do
            if [ -f "$file" ] && [ "${file##*.}" != "sigstore" ]; then
              sha256sum "$file" > "${file}.sha256"
            fi
          done

      - name: Generate in-toto attestations
        run: |
          for file in release/*; do
            if [ -f "$file" ] && [ "${file##*.}" != "sigstore" ] && [ "${file##*.}" != "sha256" ]; then
              filename=$(basename "$file")
              echo "Creating attestation for $filename..."
              cosign attest-blob --yes \
                --predicate <(echo "{\"name\": \"$filename\"}") \
                --type intoto \
                "$file" --bundle "${file}.intoto.jsonl"
            fi
          done

      - name: Upload signatures and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signatures-checksums
          path: |
            release/*.sigstore
            release/*.intoto.jsonl
            release/*.sha256
          retention-days: 1

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: aether-sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: aether-sbom.spdx.json
          retention-days: 90

  publish:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [build, attestation, sbom, sign]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: release/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sbom
          path: release/

      - name: Download signatures, checksums, and attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signatures-checksums
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attestation:
    name: Generate Attestations
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - arch: linux-amd64
            path: bin/release/aether-*-linux-amd64.tar.gz
          - arch: darwin-amd64
            path: bin/release/aether-*-darwin-amd64.tar.gz
          - arch: darwin-arm64
            path: bin/release/aether-*-darwin-arm64.tar.gz
          - arch: windows-amd64
            path: bin/release/aether-*-windows-amd64.zip
          - arch: windows-arm64
            path: bin/release/aether-*-windows-arm64.zip
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-artifacts
          path: bin/release/

      - name: Generate provenance attestation for ${{ matrix.arch }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ matrix.path }}
