# fhir-flattener service for E2E testing
# Transforms FHIR data to CSV using ViewDefinitions

services:
  fhir-flattener:
    image: ghcr.io/medizininformatik-initiative/fhir-flattener:0.1.0-alpha.7@sha256:2688c239b860ea6c6d68f448a0b9aeb6c115a7ad4e00968f0f1c0b59b7bb27a0
    working_dir: /app
    networks: [ "aether" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
