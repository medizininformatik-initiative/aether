# fhir-flattener service for E2E testing
# Transforms FHIR data to CSV using ViewDefinitions

services:
  fhir-flattener:
    image: ghcr.io/medizininformatik-initiative/fhir-flattener:0.1.0-alpha.8@sha256:d8c72fc5d55cafe0bca4e1b3996716626ac48e130babf3b9eedb72c908041203
    working_dir: /app
    networks: [ "aether" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
