name: blaze

services:
  # Blaze FHIR server used as DSF transfer target for the send step
  blaze-fhir:
    image: samply/blaze:1.6.2@sha256:4148d6cc9daf1f7237270878535d176b1e24b8d4092dcf636d42778c3a49dbc8
    ports: [ ":8080" ]
    networks: [ "aether" ]
    environment:
      BASE_URL: http://blaze-fhir:8080
      LOG_LEVEL: debug
      JAVA_TOOL_OPTIONS: "-Xmx2g"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
