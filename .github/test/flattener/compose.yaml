# fhir-flattener service for E2E testing
# Transforms FHIR data to CSV using ViewDefinitions

services:
  fhir-flattener:
    image: ghcr.io/medizininformatik-initiative/fhir-flattener:0.1.0@sha256:9249d1b3608e3762fa8101509d36b59169cccb16ce309dd6683f405d70ca19ec
    working_dir: /app
    networks: [ "aether" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
