# fhir-flattener service for E2E testing
# Transforms FHIR data to CSV using ViewDefinitions

services:
  fhir-flattener:
    image: ghcr.io/medizininformatik-initiative/fhir-flattener:0.1.0-alpha.9@sha256:a14c5d57eb488c5fd26f40e293aa46686de4d921b72fdc0788997e6f665ee4e7
    working_dir: /app
    networks: [ "aether" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
