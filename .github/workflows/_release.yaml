name: Release

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version: '1.25.5'
          cache: true

      - name: Build release binaries
        run: make release

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-artifacts
          path: bin/release/
          retention-days: 1

  sign:
    name: Sign Release Artifacts
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: release/

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign release artifacts
        run: |
          for file in release/*; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              cosign sign-blob --yes "$file" --output-signature "${file}.sig"
            fi
          done

      - name: Generate SHA256 checksums
        run: |
          cd release
          for file in *; do
            if [ -f "$file" ] && [ "${file##*.}" != "sig" ]; then
              sha256sum "$file" > "${file}.sha256"
            fi
          done

      - name: Generate in-toto attestations
        run: |
          for file in release/*; do
            if [ -f "$file" ] && [ "${file##*.}" != "sig" ] && [ "${file##*.}" != "sha256" ]; then
              filename=$(basename "$file")
              echo "Creating attestation for $filename..."
              cosign attest-blob --yes \
                --predicate <(echo "{\"name\": \"$filename\"}") \
                --type intoto \
                "$file" > "${file}.intoto.jsonl"
            fi
          done

      - name: Upload signatures and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signatures-checksums
          path: |
            release/*.sig
            release/*.sha256
            release/*.intoto.jsonl
          retention-days: 1

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Generate SBOM
        uses: anchore/sbom-action@a930d0ac434e3182448fe678398ba5713717112a # v0
        with:
          path: .
          format: spdx-json
          output-file: aether-sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom
          path: aether-sbom.spdx.json
          retention-days: 90

  publish:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [build, attestation, sbom, sign]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Download release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: release/

      - name: Download SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sbom
          path: release/

      - name: Download signatures, checksums, and attestations
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signatures-checksums
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attestation:
    name: Generate Attestations
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - arch: linux-amd64
            path: bin/release/aether-*-linux-amd64.tar.gz
          - arch: darwin-amd64
            path: bin/release/aether-*-darwin-amd64.tar.gz
          - arch: darwin-arm64
            path: bin/release/aether-*-darwin-arm64.tar.gz
          - arch: windows-amd64
            path: bin/release/aether-*-windows-amd64.zip
          - arch: windows-arm64
            path: bin/release/aether-*-windows-arm64.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-artifacts
          path: bin/release/

      - name: Generate provenance attestation for ${{ matrix.arch }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ matrix.path }}
