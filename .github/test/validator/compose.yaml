# mii-fhir-validator service for E2E testing
# Validates FHIR resources against base R4 specification
# API: POST /validateResource with Content-Type: application/fhir+json

services:
  fhir-validator:
    image: ghcr.io/medizininformatik-initiative/mii-fhir-validator:0.0.1-alpha.8@sha256:4a60074f0f780c9d497b68f67b7c62da886554fc156e19bb035f77962c363f26
    ports: [ ":8080" ]
    networks: [ "aether" ]
    volumes:
      - "./validator/config/fhir-settings.json:/app/config/fhir-settings.json:ro"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1g"
      VALIDATOR_ENABLED: "true"
      FHIR_VERSION: "4.0"
      # Disable the external terminology server (tx.fhir.org). Without this the
      # validator hangs on the first real validation doing terminology lookups,
      # blowing past aether's HTTP timeout. The E2E assertions only need
      # structural/internal-binding validation, which works with -tx n/a.
      TX_SERVER: "n/a"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/validateResource", "-X", "POST", "-H", "Content-Type: application/fhir+json", "-d", "{\"resourceType\":\"Patient\"}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
